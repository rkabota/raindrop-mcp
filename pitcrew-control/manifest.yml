modules:
  jira:projectPage:
    - key: pitcrew-dashboard
      resource: main
      resolver:
        function: resolver
      title: PitCrew Control™
  function:
    - key: resolver
      handler: index.handler
    - key: telemetry-updater
      handler: handlers/telemetryUpdater.handler
    - key: pit-engineer
      handler: handlers/pitEngineer.handler
    - key: apply-suggestion
      handler: handlers/applySuggestion.handler
  webtrigger:
    - key: refresh-telemetry
      function: telemetry-updater
app:
  id: ari:cloud:ecosystem::app/YOUR_APP_ID
permissions:
  scopes:
    - storage:app
    - read:jira-work
    - write:jira-work
    - read:jira-user
  content:
    styles:
      - unsafe-inline
